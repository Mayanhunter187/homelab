---
- name: Read the optional Discord webhook for reboot notices
  ansible.builtin.set_fact:
    kured_discord_webhook: >-
      {{ lookup('amazon.aws.ssm_parameter', monitoring_discord_webhook_param,
         on_missing='skip', on_denied='warn') | default('', true) }}
  no_log: true

# kured posts through shoutrrr, whose Discord URL form is discord://token@webhook-id
- name: Create the kured notification Secret
  ansible.builtin.command: k3s kubectl apply -f -
  args:
    stdin: |
      apiVersion: v1
      kind: Secret
      metadata:
        name: kured-notify
        namespace: kube-system
      type: Opaque
      stringData:
        url: {{ ('discord://' ~ (kured_discord_webhook | split('/'))[-1] ~ '@' ~ (kured_discord_webhook | split('/'))[-2]) | to_json }}
  register: k3s_kured_secret
  changed_when: "'created' in k3s_kured_secret.stdout or 'configured' in k3s_kured_secret.stdout"
  no_log: true
  when: kured_discord_webhook | length > 0

- name: Deploy the kured chart
  ansible.builtin.template:
    src: platform-kured.yaml.j2
    dest: /var/lib/rancher/k3s/server/manifests/platform-kured.yaml
    owner: root
    group: root
    mode: "0600"
