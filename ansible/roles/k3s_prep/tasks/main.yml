---
- name: Turn off swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0
  changed_when: true

- name: Keep swap off after reboots
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'

- name: Load the kernel modules k3s needs
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ k3s_prep_kernel_modules }}"

- name: Load those kernel modules on every boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: "{{ k3s_prep_kernel_modules | join('\n') }}\n"
    owner: root
    group: root
    mode: "0644"

- name: Set the kernel network settings k3s needs
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    reload: true
  loop: "{{ k3s_prep_sysctls | dict2items }}"
