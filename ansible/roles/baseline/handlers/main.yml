---
- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded

# A restart (not a reload) lets chrony step the clock if it has drifted
- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
