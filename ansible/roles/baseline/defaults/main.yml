---
# Upgrade all packages on every run
baseline_upgrade_packages: true

# Standard tools installed on every server
baseline_packages:
  - bash-completion
  - ca-certificates
  - curl
  - dnsutils
  - git
  - gnupg
  - htop
  - jq
  - tree
  - unzip
  - vim
  - wget

# Extra NTP servers for chrony, used alongside the distribution's pool
# (needed where the pool can't be reached, e.g. a VLAN without outbound NTP)
baseline_ntp_servers: []

# Timezone (tz database name)
baseline_timezone: America/New_York

# Max disk space the system journal may use
baseline_journald_max_use: 500M
