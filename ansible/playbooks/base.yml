- name: Baseline for all Linux hosts
  hosts: all
  become: true

  tasks:
    - name: Set timezone to Eastern
      community.general.timezone:
        name: America/New_York

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - curl
          - htop
          - qemu-guest-agent
        state: present
        update_cache: true
        cache_valid_time: 3600