---
- name: Prepare the k3s nodes
  hosts: k3s_cluster
  become: true
  roles:
    - k3s_prep

- name: Install the k3s servers
  hosts: k3s_servers
  serial: 1
  become: true
  roles:
    - k3s_server

- name: Deploy ingress (MetalLB + Traefik)
  hosts: k3s_servers[0]
  become: true
  roles:
    - k3s_ingress

- name: Deploy Argo CD
  hosts: k3s_servers[0]
  become: true
  roles:
    - k3s_argocd
