---
- name: Prepare the k3s nodes
  hosts: k3s_cluster
  become: true
  roles:
    - k3s_prep

- name: Install the k3s servers
  hosts: k3s_servers
  serial: 1
  become: true
  roles:
    - k3s_server

- name: Deploy monitoring (Prometheus, Alertmanager, Grafana)
  hosts: k3s_servers[0]
  become: true
  roles:
    - k3s_monitoring

- name: Deploy ingress (MetalLB + Traefik)
  hosts: k3s_servers[0]
  become: true
  roles:
    - k3s_ingress

- name: Deploy Argo CD
  hosts: k3s_servers[0]
  become: true
  roles:
    - k3s_argocd

- name: Deploy Longhorn (volumes on each node's HDD disk)
  hosts: k3s_cluster
  become: true
  tags: [longhorn]
  roles:
    - k3s_longhorn

- name: Deploy External Secrets and the app Secrets
  hosts: k3s_servers[0]
  become: true
  tags: [app_secrets]
  roles:
    - k3s_external_secrets
    - role: k3s_app_secrets
      when: not external_secrets_enabled

- name: Deploy Garage (the Don'Ju song store, on Longhorn)
  hosts: k3s_servers[0]
  become: true
  tags: [garage]
  roles:
    - k3s_garage

- name: Deploy kured
  hosts: k3s_servers[0]
  become: true
  roles:
    - k3s_kured
